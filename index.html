<title>Scramble</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column of chunky pixel panels; the drill canvas renders at low resolution and scales up by whole pixels. */
/* Single deliberate look: a night-blue arcade cabinet. */
:root{
  --bg:#0A1020; --dot:#141E3C; --panel:#111A33; --panel-2:#18244A; --edge:#2A3A6B;
  --ink:#EAF0FF; --muted:#8C9BC6; --accent:#FFE14D; --accent-ink:#1E1700; --accent-dk:#C9A821;
  --pink:#FF7AD9; --good:#5BE37D; --bad:#FF4D6D; --amber:#FF9E3D;
  --f-pixel:"Press Start 2P","Courier New",monospace;
  --f-body:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.5px,transparent 1.6px);background-size:18px 18px;color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;-webkit-tap-highlight-color:transparent}
.wrap{width:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.px{box-shadow:0 -4px 0 0 var(--edge),0 4px 0 0 var(--edge),-4px 0 0 0 var(--edge),4px 0 0 0 var(--edge)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:4px dashed var(--edge)}
.mark{font-family:var(--f-pixel);font-size:20px;letter-spacing:.02em;line-height:1;color:var(--accent);text-shadow:3px 3px 0 #8A1F6C}
.dateline{font-family:var(--f-pixel);font-size:9px;line-height:1.6;color:var(--muted);text-align:right}
h1,h2{font-family:var(--f-pixel);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(17px,5vw,24px);line-height:1.5}
h2{font-size:18px;line-height:1.4}
p{margin:0}
.lede{color:var(--muted);max-width:60ch}
.eyebrow{font-family:var(--f-pixel);font-size:10px;color:var(--pink);letter-spacing:.04em}
button{font:inherit;cursor:pointer;border:0;border-radius:0}
button:focus-visible{outline:3px solid var(--pink);outline-offset:6px}
.btn{background:var(--accent);color:var(--accent-ink);font-family:var(--f-pixel);font-size:13px;line-height:1.3;padding:16px 20px;min-height:52px;
  box-shadow:inset -4px -4px 0 0 var(--accent-dk),0 -4px 0 0 var(--accent-ink),0 4px 0 0 var(--accent-ink),-4px 0 0 0 var(--accent-ink),4px 0 0 0 var(--accent-ink);margin:4px}
.btn:active{box-shadow:inset 4px 4px 0 0 var(--accent-dk),0 -4px 0 0 var(--accent-ink),0 4px 0 0 var(--accent-ink),-4px 0 0 0 var(--accent-ink),4px 0 0 0 var(--accent-ink)}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:inset -4px -4px 0 0 var(--bg),0 -4px 0 0 var(--edge),0 4px 0 0 var(--edge),-4px 0 0 0 var(--edge),4px 0 0 0 var(--edge);font-size:10px;min-height:44px;padding:12px 16px}
.row-btns{display:flex;flex-wrap:wrap;gap:12px}
.ico{image-rendering:pixelated;width:26px;height:26px;vertical-align:-6px}

.roster{list-style:none;margin:4px;padding:6px 14px;background:var(--panel)}
.roster li{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed var(--edge)}
.roster li:last-child{border-bottom:0}
.roster .n{font-family:var(--f-pixel);font-size:11px;color:var(--muted)}
.roster .nm{font-weight:700;min-width:0}
.roster .sk{font-size:15px;color:var(--muted);text-align:right}
.roster .sc{font-family:var(--f-pixel);font-size:13px;text-align:right}
.roster .note{display:block;font-weight:400}

.hud{display:flex;flex-direction:column;gap:10px}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hud-name{font-family:var(--f-pixel);font-size:14px;line-height:1.3;color:var(--accent)}
.hud-count{font-family:var(--f-pixel);font-size:9px;color:var(--muted);white-space:nowrap}
.timer{height:12px;background:var(--panel);margin:0 4px;box-shadow:0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge);overflow:hidden}
.timer i{display:block;height:100%;background:var(--good);transform-origin:left;transform:scaleX(1)}
.stage{position:relative;width:calc(100% - 8px);margin:4px;aspect-ratio:1/1;background:var(--panel);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#arena{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#arena canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.prompt{min-height:2.8em;font-size:19px;font-weight:500;text-align:center;text-wrap:balance}
#controls{display:grid;gap:12px;padding:4px}
#controls.keys{grid-template-columns:repeat(4,1fr)}
#controls.two{grid-template-columns:1fr 1fr}
#controls.four{grid-template-columns:repeat(4,1fr)}
#controls.one{grid-template-columns:1fr}
.key{background:var(--panel-2);color:var(--ink);font-family:var(--f-pixel);font-size:15px;min-height:54px;
  box-shadow:inset -4px -4px 0 0 var(--panel),0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge)}
.key:active,.key.flash{background:var(--accent);color:var(--accent-ink)}
.key .ico{width:32px;height:32px;vertical-align:middle}
.key.swatch{min-height:60px}

.card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:26px;background:var(--panel-2);z-index:5}
.card .skill{font-family:var(--f-pixel);font-size:9px;color:var(--pink);line-height:1.5}
.card h2{font-size:20px;color:var(--accent)}
.card p{max-width:40ch}
.card .btn{align-self:flex-start}
.card .score{font-family:var(--f-pixel);font-size:56px;line-height:1}
.card .score small{font-size:14px;color:var(--muted)}
.card .verdict{font-family:var(--f-pixel);font-size:14px;color:var(--good)}

.total{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.total .num{font-family:var(--f-pixel);font-size:clamp(48px,16vw,76px);line-height:1;color:var(--accent);text-shadow:4px 4px 0 var(--pink)}
.total .of{font-family:var(--f-pixel);font-size:14px;color:var(--muted);padding-bottom:6px}
.rank{display:inline-block;background:var(--pink);color:#2A0020;font-family:var(--f-pixel);font-size:12px;padding:8px 10px;margin:4px}
.tiles{display:flex;gap:8px;padding:0 4px}
.tiles i{flex:1;height:18px}
.t4{background:var(--good)}.t3{background:var(--accent)}.t2{background:var(--amber)}.t1{background:var(--bad)}
.share-box{width:calc(100% - 8px);margin:4px;min-height:92px;font:inherit;font-size:16px;padding:10px;border:0;background:var(--panel);color:var(--ink);resize:none;
  box-shadow:0 -3px 0 0 var(--edge),0 3px 0 0 var(--edge),-3px 0 0 0 var(--edge),3px 0 0 0 var(--edge)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{border-top:4px solid var(--edge);padding-top:8px}
.stats b{display:block;font-family:var(--f-pixel);font-size:18px;font-weight:400;line-height:1.3}
.stats span{font-size:15px;color:var(--muted)}
.note{font-size:15px;color:var(--muted)}
.practice-tag{display:inline-block;border:3px dashed var(--muted);color:var(--muted);font-family:var(--f-pixel);font-size:9px;padding:6px 8px}
</style>

<div class="wrap">
  <header>
    <div class="mark">SCRAMBLE</div>
    <div class="dateline" id="dateline"></div>
  </header>

  <section id="home" class="wrap">
    <div class="eyebrow" id="home-eyebrow">TODAY'S SET</div>
    <h1>7 tiny drills. 30 seconds each. Same set for everyone today.</h1>
    <p class="lede">React, track, count, remember and read the angle. Every drill scores 0 to 100. The set and the shapes change at midnight.</p>
    <ol class="roster" id="roster"></ol>
    <div class="row-btns"><button class="btn" id="start-btn">START</button></div>
    <p class="note">About four minutes. Phone in portrait or a mouse both work.</p>
  </section>

  <section id="play" hidden>
    <div class="wrap" style="gap:14px">
      <div class="hud">
        <div class="hud-top"><div class="hud-name" id="hud-name"></div><div class="hud-count" id="hud-count"></div></div>
        <div class="timer"><i id="timer"></i></div>
      </div>
      <div class="stage px" id="stage">
        <div id="arena"></div>
        <div class="card" id="card" hidden></div>
      </div>
      <div class="prompt" id="prompt"></div>
      <div id="controls" hidden></div>
    </div>
  </section>

  <section id="done" class="wrap" hidden>
    <div class="eyebrow" id="done-eyebrow"></div>
    <div class="total"><div class="num" id="total-num">0</div><div class="of">/ 700</div></div>
    <div><span class="rank" id="rank"></span></div>
    <div class="tiles" id="tiles"></div>
    <ol class="roster" id="final-roster"></ol>
    <div class="stats" id="stats"></div>
    <div id="share-wrap" class="wrap" style="gap:10px">
      <div class="row-btns"><button class="btn" id="share-btn">COPY MY SCORE</button></div>
      <textarea class="share-box" id="share-text" readonly aria-label="Shareable score"></textarea>
    </div>
    <p class="note" id="countdown"></p>
    <div class="row-btns">
      <button class="btn ghost" id="practice-btn">PRACTICE: RANDOM SET</button>
      <button class="btn ghost" id="today-btn" hidden>BACK TO TODAY</button>
    </div>
  </section>
</div>

<script>
(() => {
const TAU = Math.PI * 2;
const PER_DAY = 7;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
function shuffle(rng, arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- Dates and seeding ---------- */
const LAUNCH = new Date(2026, 9, 27);
function dayKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function dayNumber(d) { return Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - LAUNCH) / 864e5) + 1; }
function seedFrom(str) { let h = 2166136261 >>> 0; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rngOf(str) {
  let a = seedFrom(str);
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- Pixel sprites ---------- */
const PAL = { red: '#FF4D6D', orange: '#FF9E3D', yellow: '#FFE14D', green: '#5BE37D', cyan: '#3EE0FF', blue: '#5B7CFF', purple: '#B26BFF', pink: '#FF7AD9' };
const COLOR_NAMES = Object.keys(PAL);
const SH = {
  circle: (x, y) => x * x + y * y <= .92,
  square: (x, y) => Math.abs(x) <= .82 && Math.abs(y) <= .82,
  triangle: (x, y) => y >= -.9 && y <= .8 && Math.abs(x) <= (y + .9) / 1.7 * .98,
  diamond: (x, y) => Math.abs(x) + Math.abs(y) <= .98,
  star: (x, y) => { const r = Math.hypot(x, y), a = Math.atan2(y, x) + Math.PI / 2, k = ((a / (TAU / 5)) % 1 + 1) % 1; return r <= .4 + .6 * Math.abs(k - .5) * 2; },
  heart: (x, y) => { const X = x * 1.2, Y = -y * 1.25 + .3, q = X * X + Y * Y - 1; return q * q * q - X * X * Y * Y * Y <= 0; },
  plus: (x, y) => (Math.abs(x) <= .32 && Math.abs(y) <= .9) || (Math.abs(y) <= .32 && Math.abs(x) <= .9),
  octagon: (x, y) => Math.abs(x) <= .86 && Math.abs(y) <= .86 && Math.abs(x) + Math.abs(y) <= 1.22,
  arrow: (x, y) => (x >= -.9 && x <= .05 && Math.abs(y) <= .3) || (x >= -.05 && x <= .95 && Math.abs(y) <= (.95 - x)),
  block: (x, y) => Math.abs(x) <= .95 && Math.abs(y) <= .95
};
const SHAPES = ['circle', 'square', 'triangle', 'diamond', 'star', 'heart', 'plus'];
const plural = s => s + 's';
function rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(h, t, a) { const p = rgb(h), q = rgb(t); return `rgb(${p.map((v, i) => Math.round(v + (q[i] - v) * a)).join(',')})`; }
const sprCache = new Map();
function sprite(shape, color, n, rot = 0) {
  const col = PAL[color] || color, key = `${shape}|${col}|${n}|${rot}`;
  if (sprCache.has(key)) return sprCache.get(key);
  const c = document.createElement('canvas'); c.width = c.height = n + 2;
  const g = c.getContext('2d'), f = SH[shape], cs = Math.cos(rot), sn = Math.sin(rot), on = new Uint8Array(n * n);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const x = (i + .5) / n * 2 - 1, y = (j + .5) / n * 2 - 1;
    on[j * n + i] = f(x * cs + y * sn, -x * sn + y * cs) ? 1 : 0;
  }
  const at = (i, j) => i >= 0 && j >= 0 && i < n && j < n && on[j * n + i] === 1;
  const L = mix(col, '#FFFFFF', .45), D = mix(col, '#000000', .32);
  for (let j = -1; j <= n; j++) for (let i = -1; i <= n; i++) {
    let fill = null;
    if (at(i, j)) fill = (!at(i - 1, j) || !at(i, j - 1)) ? L : (!at(i + 1, j) || !at(i, j + 1)) ? D : col;
    else if (at(i - 1, j) || at(i + 1, j) || at(i, j - 1) || at(i, j + 1)) fill = '#05081A';
    if (fill) { g.fillStyle = fill; g.fillRect(i + 1, j + 1, 1, 1); }
  }
  sprCache.set(key, c); return c;
}
const icon = (shape, color, rot = 0) => `<img class="ico" alt="" src="${sprite(shape, color, 12, rot).toDataURL()}">`;
const shapeLabel = (shape, color) => `${icon(shape, color)} ${color ? color + ' ' : ''}${plural(shape)}`;

/* ---------- The drill pool (7 of these are picked each day) ---------- */
const DRILLS = [
{
  id: 'blackout', name: 'Blackout', skill: 'Reaction time',
  variant: r => ({ color: pick(r, ['red', 'pink', 'cyan', 'yellow']), decoy: r() < .5 }),
  how: v => `Five lights switch on, one at a time. The instant they all go dark, tap. Tap early and it's a false start.${v.decoy ? ' Careful: some lights flicker to fake you out.' : ''}`,
  run(api, v) {
    const P = api.px(), { W, H } = P, N = 5, lamp = Math.round(W / 8), gap = Math.round(W / 40);
    const holds = Array.from({ length: N }, () => 250 + api.rng() * 2300), decoyAt = v.decoy ? [1, 3] : [];
    const times = []; let lit = 0, state = 'rest', t0 = 0, trial = 0, tok = 0, msg = 'READY', sub = '', flick = -1;
    api.prompt('Tap the screen, or press Space, the moment the lights go out.'); api.timer(1);
    api.loop(() => {
      P.clear();
      const total = N * lamp + (N - 1) * gap, x0 = (W - total) / 2, y = H * .4;
      P.rect(x0 - 5, y - lamp / 2 - 5, total + 10, lamp + 10, '#05081A');
      for (let i = 0; i < N; i++) P.spr('circle', i < lit && i !== flick ? v.color : '#2A3352', lamp, x0 + i * (lamp + gap) + lamp / 2, y);
      P.text(msg, W / 2, H * .66, msg === 'GO!' ? PAL.green : css('--ink'), 16);
      P.text(sub, W / 2, H * .8, css('--muted'), 8);
    });
    function startTrial() {
      const my = ++tok; state = 'arming'; lit = 0; flick = -1; msg = 'WAIT'; sub = `START ${trial + 1} OF ${N}`;
      for (let i = 1; i <= N; i++) api.later(() => { if (tok === my) lit = i; }, 450 * i);
      if (decoyAt.includes(trial)) {
        const at = 450 * N + holds[trial] * .45;
        api.later(() => { if (tok === my) flick = 2; }, at);
        api.later(() => { if (tok === my) flick = -1; }, at + 220);
      }
      api.later(() => {
        if (tok !== my) return;
        lit = 0; msg = 'GO!'; state = 'go'; t0 = performance.now();
        api.later(() => { if (tok === my && state === 'go') { msg = 'ZZZ'; record(600, 'COUNTS AS 600MS'); } }, 1500);
      }, 450 * N + holds[trial]);
    }
    function record(ms, note) {
      tok++; state = 'rest'; times.push(ms); sub = note; trial++; api.timer(1 - trial / N);
      if (trial >= N) api.later(() => { const avg = Math.round(times.reduce((a, b) => a + b, 0) / N); api.done((480 - avg) / 300 * 100, `Average ${avg} ms`); }, 900);
      else api.later(startTrial, 1100);
    }
    function tap(e) {
      if (e.type === 'keydown') { if (e.code !== 'Space') return; e.preventDefault(); }
      if (state === 'arming') { lit = 0; msg = 'TOO SOON'; record(500, 'COUNTS AS 500MS'); }
      else if (state === 'go') { const ms = Math.round(performance.now() - t0); msg = `${ms}MS`; record(ms, ms < 230 ? 'LIGHTNING' : ms < 290 ? 'SHARP' : ms < 360 ? 'NICE' : 'SLEEPY'); }
    }
    api.on(api.stage, 'pointerdown', tap); api.on(window, 'keydown', tap);
    api.later(startTrial, 700);
  }
},
{
  id: 'shuffle', name: 'Shell Shuffle', skill: 'Multiple object tracking',
  variant: r => ({ shape: pick(r, SHAPES), color: pick(r, COLOR_NAMES), fast: r() < .4 }),
  how: v => `A few ${plural(v.shape)} blink, then they all start shuffling. Keep your eyes on the ones that blinked and tap them when the shuffling stops. Two rounds.`,
  run(api, v) {
    const P = api.px(), { W, H } = P, rng = api.rng, s = Math.round(W * .09), r = s / 2, pad = 4, STEPS = 420;
    const ROUNDS = [{ n: 8, t: 3, sp: v.fast ? .36 : .30 }, { n: 10, t: 4, sp: v.fast ? .46 : .40 }];
    let ri = 0, hit = 0, tot = 0, items, phase, phaseT, steps, picks, last = null;
    function setup() {
      const cfg = ROUNDS[ri]; items = []; let guard = 0;
      while (items.length < cfg.n && guard++ < 5000) {
        const x = pad + r + rng() * (W - 2 * pad - 2 * r), y = pad + r + rng() * (H - 2 * pad - 2 * r);
        if (items.every(b => Math.hypot(b.x - x, b.y - y) > s * 1.4)) items.push({ x, y, a: rng() * TAU, tg: items.length < cfg.t, sel: false });
      }
      phase = 'show'; phaseT = 0; steps = 0; picks = 0; api.timer(1);
      api.prompt(`Round ${ri + 1} of 2. Watch the ${cfg.t} that blink.`);
    }
    function step(sp) {
      const vel = sp * W / 60, lo = pad + r, hi = W - pad - r;
      for (const b of items) {
        b.a += (rng() - .5) * .3; b.x += Math.cos(b.a) * vel; b.y += Math.sin(b.a) * vel;
        if (b.x < lo) { b.x = lo; b.a = Math.PI - b.a; } if (b.x > hi) { b.x = hi; b.a = Math.PI - b.a; }
        if (b.y < lo) { b.y = lo; b.a = -b.a; } if (b.y > hi) { b.y = hi; b.a = -b.a; }
      }
      for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
        const p = items[i], q = items[j], dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy);
        if (d < s && d > 0) { const t = p.a; p.a = q.a; q.a = t; const push = (s - d) / 2, nx = dx / d, ny = dy / d; p.x -= nx * push; p.y -= ny * push; q.x += nx * push; q.y += ny * push; }
      }
    }
    api.loop(now => {
      if (last == null) last = now; const dt = Math.min(.05, (now - last) / 1000); last = now; phaseT += dt;
      const cfg = ROUNDS[ri];
      if (phase === 'show' && phaseT > 2.2) { phase = 'move'; phaseT = 0; api.prompt('Keep watching…'); }
      if (phase === 'move') {
        const target = Math.min(STEPS, Math.floor(phaseT * 60));
        while (steps < target) { step(cfg.sp); steps++; }
        api.timer(1 - steps / STEPS);
        if (steps >= STEPS) { phase = 'pick'; api.prompt(`Tap the ${cfg.t} you followed. 0 of ${cfg.t} picked.`); }
      }
      P.clear();
      const blink = Math.floor(now / 180) % 2 === 0;
      for (const b of items) {
        P.spr(v.shape, phase === 'show' && b.tg && blink ? '#FFFFFF' : v.color, s, b.x, b.y);

/* ---------- App state ---------- */
const now = new Date(), TODAY = dayKey(now), DAY = dayNumber(now);
const KEY = k => `scramble:v2:${k}`;
let S;
function newRun(practice) {
  const seedKey = practice ? 'practice-' + Math.random().toString(36).slice(2) : TODAY;
  const order = shuffle(rngOf(seedKey + ':order'), DRILLS.map(d => d.id)).slice(0, PER_DAY);
  return { seedKey, practice, order, results: [] };
}
function loadToday() {
  const fresh = newRun(false), saved = store.get(KEY(TODAY), null);
  if (saved && Array.isArray(saved.results)) fresh.results = saved.results.slice(0, PER_DAY);
  return fresh;
}
function save() { if (!S.practice) store.set(KEY(TODAY), { results: S.results }); }
const drillById = id => DRILLS.find(d => d.id === id);
const variantFor = d => d.variant(rngOf(S.seedKey + ':' + d.id + ':variant'));
const tier = s => s >= 85 ? 4 : s >= 60 ? 3 : s >= 35 ? 2 : 1;
const TIER_EMOJI = { 4: '🟩', 3: '🟨', 2: '🟧', 1: '🟥' };
const verdict = s => s >= 95 ? 'PERFECT' : s >= 80 ? 'GREAT' : s >= 60 ? 'GOOD' : s >= 40 ? 'OK' : s >= 20 ? 'OOF' : 'GLITCHED';
const rank = t => t >= 600 ? 'SUPERHUMAN' : t >= 500 ? 'SHARPSHOOTER' : t >= 400 ? 'QUICK STUDY' : t >= 300 ? 'SWITCHED ON' : t >= 200 ? 'WARMING UP' : 'STILL LOADING';

function show(id) { for (const s of ['home', 'play', 'done']) $('#' + s).hidden = s !== id; window.scrollTo(0, 0); }
$('#dateline').innerHTML = `NO. ${DAY}<br>${now.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }).toUpperCase()}`;

function renderHome() {
  const done = S.results.length;
  $('#roster').innerHTML = S.order.map((id, i) => {
    const d = drillById(id), res = S.results[i];
    return `<li><span class="n">${i + 1}</span><span class="nm">${d.name}</span>${res ? `<span class="sc">${res.score}</span>` : `<span class="sk">${d.skill}</span>`}</li>`;
  }).join('');
  $('#start-btn').textContent = done ? `RESUME AT ${done + 1}` : 'START';
  $('#home-eyebrow').textContent = done ? `${done} OF ${PER_DAY} DONE TODAY` : 'TODAY\'S SET';

/* ---------- Drill runner ---------- */
const arena = $('#arena'), card = $('#card'), controls = $('#controls'), timerEl = $('#timer');
let cleanups = [];
function teardown() { cleanups.forEach(f => { try { f(); } catch (e) {} }); cleanups = []; arena.innerHTML = ''; controls.innerHTML = ''; controls.hidden = true; controls.className = ''; }

function introDrill() {
  const i = S.results.length, d = drillById(S.order[i]), v = variantFor(d);
  teardown(); show('play');
  $('#hud-name').textContent = d.name.toUpperCase(); $('#hud-count').textContent = `${S.practice ? 'PRACTICE ' : ''}${i + 1}/${PER_DAY}`;
  timerEl.style.transform = 'scaleX(1)'; $('#prompt').textContent = '';
  card.innerHTML = `<div class="skill">${d.skill.toUpperCase()}</div><h2>${d.name}</h2><p>${d.how(v)}</p><button class="btn" id="go-btn">GO</button>`;
  card.hidden = false;
  const go = $('#go-btn'); go.focus({ preventScroll: true });
  go.addEventListener('click', () => { card.hidden = true; runDrill(d, v, i); });
}

function makePx() {
  const cw = arena.clientWidth, ch = arena.clientHeight, scale = Math.max(2, Math.floor(Math.min(cw, ch) / 120));
  const W = Math.floor(cw / scale), H = Math.floor(ch / scale), c = document.createElement('canvas');
  c.width = W; c.height = H; c.style.width = W * scale + 'px'; c.style.height = H * scale + 'px';
  arena.appendChild(c);
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
  const bgg = bg.getContext('2d'); bgg.fillStyle = css('--panel'); bgg.fillRect(0, 0, W, H); bgg.fillStyle = css('--dot');
  for (let y = 3; y < H; y += 8) for (let x = 3; x < W; x += 8) bgg.fillRect(x, y, 1, 1);
  const P = {
    canvas: c, g, W, H, scale,
    clear() { g.drawImage(bg, 0, 0); },
    rect(x, y, w, h, col) { g.fillStyle = col; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); },
    frame(x, y, w, h, col, t = 1) { x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h); P.rect(x, y, w, t, col); P.rect(x, y + h - t, w, t, col); P.rect(x, y, t, h, col); P.rect(x + w - t, y, t, h, col); },
    spr(shape, color, size, x, y, rot = 0) { const im = sprite(shape, color, size, rot); g.drawImage(im, Math.round(x - im.width / 2), Math.round(y - im.height / 2)); },
    text(str, x, y, col, size = 8, align = 'center') { g.font = `${size}px "Press Start 2P", monospace`; g.textAlign = align; g.textBaseline = 'middle'; g.fillStyle = col; g.fillText(str, Math.round(x), Math.round(y)); },
    pos(e) { const rc = c.getBoundingClientRect(); return { x: (e.clientX - rc.left) / rc.width * W, y: (e.clientY - rc.top) / rc.height * H }; }
  };
  P.clear(); return P;
}

function runDrill(d, v, i) {
  let finished = false;
  const api = {
    rng: rngOf(S.seedKey + ':' + d.id),
    stage: arena,
    px: makePx,
    prompt: (t, html) => { if (html) $('#prompt').innerHTML = t; else $('#prompt').textContent = t; },
    timer: f => { timerEl.style.transform = `scaleX(${clamp(f, 0, 1)})`; },
    later(fn, ms) { const id = setTimeout(() => { if (!finished) fn(); }, ms); cleanups.push(() => clearTimeout(id)); return id; },
    loop(fn) {
      let id; const tick = t => { if (finished) return; if (fn(t) === false) return; id = requestAnimationFrame(tick); };
      id = requestAnimationFrame(tick); cleanups.push(() => cancelAnimationFrame(id));
    },
    on(el, ev, fn, opt) { el.addEventListener(ev, fn, opt); cleanups.push(() => el.removeEventListener(ev, fn, opt)); },
    showKeys(n, fn) {
      controls.className = 'keys'; controls.hidden = false;
      controls.innerHTML = Array.from({ length: n }, (_, j) => `<button class="key" data-n="${j + 1}">${j + 1}</button>`).join('');
      controls.querySelectorAll('button').forEach(b => b.addEventListener('click', () => fn(+b.dataset.n)));
    },
    showButtons(list, layout = 'two') {
      controls.className = layout; controls.hidden = false;
      controls.innerHTML = list.map((b, j) => `<button class="key${layout === 'four' ? ' swatch' : ''}" data-j="${j}" aria-label="${b.label}">${b.html}</button>`).join('');
      controls.querySelectorAll('button').forEach(b => b.addEventListener('pointerdown', e => {
        e.preventDefault(); b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 120); list[+b.dataset.j].fn();
      }));
    },
    hideControls() { controls.hidden = true; controls.innerHTML = ''; },
    done(score, detail) {
      if (finished) return; finished = true;
      const sc = Math.round(clamp(score, 0, 100));
      setTimeout(() => {
        teardown();
        S.results[i] = { id: d.id, score: sc, detail }; save();
        const last = S.results.length >= PER_DAY;
        card.innerHTML = `<div class="skill">${d.name.toUpperCase()}</div><div class="score">${sc}<small> /100</small></div><div class="verdict">${verdict(sc)}</div><p>${detail}</p><button class="btn" id="next-btn">${last ? 'SEE MY SCORE' : 'NEXT DRILL'}</button>`;
        card.hidden = false; timerEl.style.transform = 'scaleX(0)';
        $('#prompt').textContent = last ? 'That\'s the full set.' : `Up next: ${drillById(S.order[i + 1]).name}`;
        const nb = $('#next-btn'); nb.focus({ preventScroll: true });
        nb.addEventListener('click', () => last ? renderDone() : introDrill());
      }, 250);
    }
  };
  d.run(api, v);
}

/* ---------- Results ---------- */
let countdownId = null;
function streakInfo() {
  const hist = store.get(KEY('hist'), {}); let streak = 0; const d = new Date(now);
  while (hist[dayKey(d)] != null) { streak++; d.setDate(d.getDate() - 1); }
  const vals = Object.values(hist);
  return { streak, played: vals.length, best: vals.length ? Math.max(...vals) : 0 };
}
function renderDone() {
  teardown(); card.hidden = true;
  const total = S.results.reduce((a, r) => a + r.score, 0);

  $('#done-eyebrow').innerHTML = S.practice ? '<span class="practice-tag">PRACTICE RUN</span>' : `SCRAMBLE NO. ${DAY} · FINAL`;
  $('#total-num').textContent = total; $('#rank').textContent = rank(total);
  $('#tiles').innerHTML = S.results.map(r => `<i class="t${tier(r.score)}" title="${drillById(r.id).name}: ${r.score}"></i>`).join('');
  $('#final-roster').innerHTML = S.results.map((r, i) => `<li><span class="n">${i + 1}</span><span class="nm">${drillById(r.id).name}<span class="note">${r.detail}</span></span><span class="sc">${r.score}</span></li>`).join('');
  const st = streakInfo();
  $('#stats').innerHTML = `<div><b>${st.streak}</b><span>Day streak</span></div><div><b>${st.best}</b><span>Best total</span></div><div><b>${st.played}</b><span>Days played</span></div>`;
  $('#stats').hidden = S.practice;
  $('#share-text').value = `Scramble No. ${DAY} · ${total}/700\n${S.results.map(r => TIER_EMOJI[tier(r.score)]).join('')}\n${rank(total).toLowerCase()}`;
  $('#share-wrap').hidden = S.practice; $('#today-btn').hidden = !S.practice;
  clearInterval(countdownId);
  const tick = () => {
    const t = new Date(), mid = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1), s = Math.max(0, Math.floor((mid - t) / 1000));
    $('#countdown').textContent = `New set in ${Math.floor(s / 3600)}h ${String(Math.floor(s / 60) % 60).padStart(2, '0')}m ${String(s % 60).padStart(2, '0')}s.`;
  };

}

$('#share-btn').addEventListener('click', () => {
  const ta = $('#share-text'), btn = $('#share-btn');
  const ok = () => { btn.textContent = 'COPIED'; setTimeout(() => { btn.textContent = 'COPY MY SCORE'; }, 1600); };
  const fallback = () => { ta.focus(); ta.select(); btn.textContent = 'SELECTED, COPY IT BELOW'; };
  try { navigator.clipboard.writeText(ta.value).then(ok, fallback); } catch (e) { fallback(); }
});
